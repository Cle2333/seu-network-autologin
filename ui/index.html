<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>东南大学校园网</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="drag-bar"></div>

<main>
  <!-- 状态区 -->
  <section class="status-card" id="statusCard">
    <div class="status-top">
      <div class="dot" id="statusDot"></div>
      <div class="status-text">
        <h1 id="statusTitle">正在检查</h1>
        <p id="statusSub">连接校园网中…</p>
      </div>
    </div>

    <div class="meta" id="meta">
      <div class="meta-row"><span>场景</span><b id="mScene">—</b></div>
      <div class="meta-row"><span>本机</span><b id="mIp">—</b></div>
      <div class="meta-row"><span>账号</span><b id="mAccount">—</b></div>
    </div>
  </section>

  <!-- 场景切换：这是主操作 -->
  <div class="scenes" id="sceneButtons"></div>

  <!-- 次操作 -->
  <div class="actions">
    <button class="primary" id="btnLogin">
      <span class="spinner"></span><span class="label">立即认证</span>
    </button>
    <button class="ghost" id="btnRefresh" title="刷新状态">刷新</button>
  </div>

  <!-- 视图切换 -->
  <nav class="tabs">
    <button class="tab active" data-view="viewLog">日志</button>
    <button class="tab" data-view="viewSettings">设置</button>
  </nav>

  <!-- 日志 -->
  <section class="panel" id="viewLog">
    <pre class="log" id="logBox">加载中…</pre>
    <button class="link" id="btnOpenDir">在访达中打开</button>
  </section>

  <!-- 设置：两个场景各自一套 -->
  <section class="panel hidden" id="viewSettings">
    <label class="check">
      <input id="ckAutoReconnect" type="checkbox" checked>
      <span>掉线自动重连</span>
    </label>
    <p class="hint">检测到掉线会自动认证，换地方连不上会自动试另一个场景。想彻底离线就退出程序。</p>

    <label class="check">
      <input id="ckAutostart" type="checkbox">
      <span>开机自动启动</span>
    </label>
    <p class="hint" id="autostartHint">登录后自动打开并认证一次。</p>

    <div class="divider"></div>

    <!-- 场景 1 -->
    <div class="scene-editor" data-index="0">
      <div class="scene-head">
        <b class="scene-label">宿舍</b>
        <span class="scene-wifi">SEU-ISP</span>
      </div>
      <label class="field">
        <span>账号</span>
        <input class="in-account" type="text" placeholder="一卡通号" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span>密码</span>
        <input class="in-password" type="password" placeholder="留空 = 不修改" autocomplete="off">
      </label>
      <div class="field">
        <span>运营商</span>
        <div class="segmented in-carrier">
          <button data-v="" class="on">不确定</button>
          <button data-v="1">移动</button>
          <button data-v="2">电信</button>
          <button data-v="3">联通</button>
        </div>
      </div>
    </div>

    <!-- 场景 2 -->
    <div class="scene-editor" data-index="1">
      <div class="scene-head">
        <b class="scene-label">教室</b>
        <span class="scene-wifi">SEU-WLAN</span>
      </div>
      <label class="field">
        <span>账号</span>
        <input class="in-account" type="text" placeholder="教室登的号" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span>密码</span>
        <input class="in-password" type="password" placeholder="留空 = 和宿舍一样" autocomplete="off">
      </label>
      <p class="hint">校园网账号通常带 <code>,0,</code> 前缀，不用自己写。</p>
    </div>

    <button class="primary small" id="btnSave">保存</button>
    <p class="hint" id="saveHint"></p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
