name: Release

# 打 tag 时自动构建三平台安装包并发布 Release。
#   git tag v3.0.0 && git push origin v3.0.0
#
# 也支持手动触发（Actions 页面 → Run workflow），手动触发时不发 Release，
# 只产出构建产物供下载检查。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple Silicon)
            artifact: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-latest
            name: macOS (Intel)
            artifact: macos-x64
            target: x86_64-apple-darwin
          - os: windows-latest
            name: Windows
            artifact: windows-x64
            target: ""
          - os: ubuntu-22.04
            name: Linux
            artifact: linux-x64
            target: ""

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            file \
            libssl-dev

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: 打包
        shell: bash
        run: |
          cd src-tauri
          if [ -n "${{ matrix.target }}" ]; then
            cargo tauri build --target "${{ matrix.target }}"
          else
            cargo tauri build
          fi

      - name: 整理产物
        shell: bash
        run: |
          mkdir -p out
          cd src-tauri/target
          # 只从 bundle 目录取，并排除 dmg 制作过程中的临时文件（rw.*.dmg）
          find . -path "*/release/bundle/*" \
               \( -name "*.dmg" -o -name "*.app" -o -name "*.msi" \
                  -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" \) \
               ! -name "rw.*" \
               -exec cp -R {} "$GITHUB_WORKSPACE/out/" \; 2>/dev/null || true
          echo "=== 产物 ==="
          ls -lh "$GITHUB_WORKSPACE/out" || echo "（空）"

      - name: 压缩 .app（保留权限）
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          cd out
          for app in *.app; do
            [ -d "$app" ] || continue
            base="${app%.app}-${{ matrix.artifact }}"
            zip -qry "${base}.zip" "$app"
            rm -rf "$app"
          done
          ls -lh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: seu-net-${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
          body: |
            ## 安装

            | 平台 | 文件 |
            | --- | --- |
            | macOS (Apple Silicon) | `*-macos-arm64.zip`，解压后拖进「应用程序」 |
            | macOS (Intel) | `*-macos-x64.zip`，同上 |
            | Windows | `.msi` 双击安装 |
            | Linux | `.deb` 或 `.AppImage` |

            > 未签名的包首次打开会被系统拦一下：
            > macOS 右键 →「打开」；Windows 点「更多信息 → 仍要运行」。

            ## 说明

            - 认证逻辑依赖系统里的 `python3`
              （macOS 装 Command Line Tools 即有，Linux 一般自带）
            - 关窗口最小化到菜单栏，托盘右键「退出」才是真的退出
            - 不占 Dock，不会残留后台进程
